<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        .container{max-width:800px;margin:3rem auto;padding:0 1rem}
        .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
        button{padding:0.5rem 1rem;cursor:pointer}
        .item{display:flex;justify-content:space-between;align-items:center;padding:1rem 0;border-bottom:1px solid #eee}
    </style>
</head>
<body>
    <div class="container">
        <div class="bar">
            <h2>文章管理</h2>
            <button onclick="location.href='editor.html'">新建文章</button>
        </div>
        <div id="list"></div>
    </div>
    <script>
        const token = localStorage.getItem("token")
        if(!token) location.href="login.html"

        async function load(){
            const res = await fetch("/api/admin/articles",{
                headers:{"Authorization":token}
            })
            const json = await res.json()
            const wrap = document.getElementById("list")
            json.data.forEach(art=>{
                const div = document.createElement("div")
                div.className="item"
                div.innerHTML=`
                    <div>${art.title} ${art.is_draft?"【草稿】":""}</div>
                    <div>
                        <button onclick="edit(${art.id})">编辑</button>
                        <button onclick="del(${art.id})">删除</button>
                    </div>
                `
                wrap.appendChild(div)
            })
        }
        function edit(id){
            location.href=`editor.html?id=${id}`
        }
        async function del(id){
            if(!confirm("确定删除？")) return
            await fetch("/api/admin/article/delete",{
                method:"DELETE",
                headers:{"Authorization":token,"Content-Type":"application/json"},
                body:JSON.stringify({id})
            })
            load()
        }
        load()
    </script>
</body>
</html>
