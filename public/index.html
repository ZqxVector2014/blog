<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客首页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        .container{max-width:800px;margin:4rem auto;padding:0 1rem}
        .article-item{padding:1rem 0;border-bottom:1px solid #eee}
        .title{font-size:1.25rem;color:#222;text-decoration:none}
        .time{font-size:0.85rem;color:#666;margin-top:0.5rem}
    </style>
</head>
<body>
    <div class="container">
        <h1>我的博客</h1>
        <div id="list"></div>
    </div>
    <script>
        async function loadArticles(){
            const res = await fetch("/api/articles")
            const json = await res.json()
            const wrap = document.getElementById("list")
            json.data.forEach(art=>{
                const div = document.createElement("div")
                div.className = "article-item"
                div.innerHTML = `
                    <a class="title" href="post.html?id=${art.id}">${art.title}</a>
                    <div class="time">${art.create_time}</div>
                `
                wrap.appendChild(div)
            })
        }
        loadArticles()
    </script>
</body>
</html>
