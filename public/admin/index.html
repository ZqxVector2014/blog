<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        .box{max-width:400px;margin:6rem auto;padding:2rem}
        input{width:100%;padding:0.75rem;margin:0.5rem 0;border:1px solid #ccc;border-radius:6px}
        button{width:100%;padding:0.75rem;background:#222;color:#fff;border:none;border-radius:6px;cursor:pointer}
        #msg{margin-top:1rem;color:red}
    </style>
</head>
<body>
    <div class="box">
        <h2>后台登录</h2>
        <input type="password" id="pwd" placeholder="管理员密码">
        <button onclick="login()">登录</button>
        <div id="msg"></div>
    </div>
    <script>
        async function login(){
            const pwd = document.getElementById("pwd").value
            const res = await fetch("/api/admin/login",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({password:pwd})
            })
            const json = await res.json()
            if(json.success){
                localStorage.setItem("token",json.token)
                location.href="index.html"
            }else{
                document.getElementById("msg").innerText = json.msg
            }
        }
    </script>
</body>
</html>
